name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if manifest.json or README.md drifted from sites.js, and if any
      # site stopped gating the way it should.
      - run: npm test
